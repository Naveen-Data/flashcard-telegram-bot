name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,MCP_HOST,MCP_AUTH_TOKEN
          script: |
            cd ~/flashcard-telegram-bot
            git pull origin main
            printf "TELEGRAM_BOT_TOKEN=%s\nMCP_HOST=%s\nMCP_AUTH_TOKEN=%s\n" "$TELEGRAM_BOT_TOKEN" "$MCP_HOST" "$MCP_AUTH_TOKEN" > .env
            chmod 600 .env
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart studybot studybot-mcp
            echo "Deployed at $(date)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MCP_HOST: ${{ secrets.MCP_HOST }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
