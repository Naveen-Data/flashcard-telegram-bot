name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,MCP_HOST,WEB_ALLOWED_ORIGINS,PGHOST,PGPORT,PGUSER,PGPASSWORD,PGDATABASE,PGSSLMODE
          script: |
            cd ~/flashcard-telegram-bot
            git pull origin main
            printf "TELEGRAM_BOT_TOKEN=%s\nMCP_HOST=%s\nWEB_ALLOWED_ORIGINS=%s\nPGHOST=%s\nPGPORT=%s\nPGUSER=%s\nPGPASSWORD=%s\nPGDATABASE=%s\nPGSSLMODE=%s\n" "$TELEGRAM_BOT_TOKEN" "$MCP_HOST" "$WEB_ALLOWED_ORIGINS" "$PGHOST" "$PGPORT" "$PGUSER" "$PGPASSWORD" "$PGDATABASE" "$PGSSLMODE" > .env
            chmod 600 .env
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            alembic upgrade head
            sudo systemctl restart studybot studybot-mcp
            echo "Deployed at $(date)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MCP_HOST: ${{ secrets.MCP_HOST }}
          WEB_ALLOWED_ORIGINS: ${{ vars.WEB_ALLOWED_ORIGINS }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
